[package]
name = "oxideav-mpegts-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# MPEG-TS (ISO/IEC 13818-1) is a fixed-grid container whose every walk
# decision is nonetheless attacker-controlled: the 188-byte packet grid
# (plus the 192-byte prefixed and 204-byte trailered physical
# framings), the adaptation-field length + optional-field pairings
# (§2.4.3.4/§2.4.3.5), the 12-bit `section_length` of every PSI / DVB
# SI section reassembled across packets via pointer_field + PUSI
# (§2.4.4), the two-level descriptor TLV loops (§2.6 + EN 300 468 §6),
# the PES optional-header ladder (Table 2-17), the 33-bit PTS/DTS ring
# (§2.4.3.7), and the PCR arithmetic driving duration probes, seek
# bisection, and the §2.4.2 T-STD arrival clock.
#
# Classic attacker primitives exercised here:
#
#   * section-length arithmetic — `section_length` claims past the
#     1021-byte PSI cap, truncated sections, back-to-back sections in
#     one payload, stuffing terminators, CRC-32 trailers;
#   * descriptor-loop walking — TLV lengths overshooting the loop or
#     the section, nested loops (PMT program + ES, NIT/BAT two-level,
#     EIT per-event), extension-descriptor envelopes;
#   * PES header decode — flag-gated optional areas overrunning
#     `PES_header_data_length`, both `PES_packet_length` forms,
#     reassembly across continuity-counter skips;
#   * clock arithmetic — PCR/OPCR 33+9-bit decode, 33-bit PTS/DTS
#     wrap-vs-discontinuity classification, splice countdowns;
#   * physical framing — sync-byte corruption, resync, 188/192/204
#     layout misdetection.
#
# Workspace policy bars external multimedia-library source as a
# cross-decode oracle, so the contracts are internal: hostile legs
# assert panic-freedom (any byte sequence must parse-or-error with
# bounded work and allocation); the mux leg asserts the round-trip
# identity contract on valid-by-construction multi-program plans
# (mux succeeds, output is validator-conformant and — in CBR mode —
# T-STD-conformant, re-demuxes to the exact per-stream timestamp /
# payload / keyframe sequence).
[dependencies]
libfuzzer-sys = "0.4"
oxideav-core = "0.1"

[dependencies.oxideav-mpegts]
path = ".."

# Prevent this from interfering with the umbrella workspace.
[workspace]
members = ["."]

[profile.release]
debug = 1

# Shared scaffolding: the Recipe byte-reader, the valid-by-construction
# multi-program MuxPlan, and the hostile-input battery every target
# funnels into.
[lib]
name = "oxideav_mpegts_fuzz"
path = "src/lib.rs"
test = false
doc = false

# Target 1: arbitrary hostile bytes through the whole demux-side
# surface — validator, packet walk, PSI assembly + every table parser
# + descriptor walks, PES reassembly, clock trackers, T-STD replay,
# and the typed demuxer battery (open, drain, RAP index, all three
# seek paths). Panic-free contract only.
[[bin]]
name = "demux"
path = "fuzz_targets/demux.rs"
test = false
doc = false

# Target 2: hostile bytes straight into the standalone unit parsers —
# every PSI/SI table parser, descriptor walks, PES packet decode, the
# section assembler, UTC-time decode — plus encode∘parse fixed-point
# asserts for the write-side duals (PES header spec, adaptation-field
# spec, PSI section builders).
[[bin]]
name = "parse_units"
path = "fuzz_targets/parse_units.rs"
test = false
doc = false

# Target 3: structure-aware write-side recipes — decode the fuzz
# bytes into a valid-by-construction multi-program mux plan (programs
# x streams x packets x SI options x splice / discontinuity / CBR /
# PSI-repetition knobs), mux it, and assert conformance + T-STD +
# round-trip identity through our own demuxer.
[[bin]]
name = "mux_roundtrip"
path = "fuzz_targets/mux_roundtrip.rs"
test = false
doc = false

# Target 4: structure-aware hostile mutation — build a writer-shaped
# fixture from the recipe bytes, then apply fuzz-directed sync-byte
# kills, header/section/CRC flips, truncations, packet drops /
# duplicates, and 192/204 reframing before feeding the mutant back
# through the hostile battery. Panic-free contract.
[[bin]]
name = "structured_mutate"
path = "fuzz_targets/structured_mutate.rs"
test = false
doc = false
